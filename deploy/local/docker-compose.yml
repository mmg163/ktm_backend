services:
  postgres:
    image: timescale/timescaledb:2.32.1-pg16
    environment:
      POSTGRES_DB: ktm_revisor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "127.0.0.1:15432:5432"
    secrets:
      - postgres_password
      - ktm_migrator_password
      - ktm_app_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../db:/db:ro
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ktm_revisor"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "127.0.0.1:19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:19092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:3.9.1
    entrypoint: ["/bin/sh", "/local/init-topics.sh"]
    restart: "no"
    volumes:
      - ./init-topics.sh:/local/init-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy

  migrate:
    image: postgres:16.16-alpine3.24
    entrypoint: ["sh", "/migrate/migrate.sh"]
    user: "1654:1654"
    read_only: true
    restart: "no"
    tmpfs:
      - /tmp
      - /var/lib/postgresql/data
    environment:
      DataSaver__Postgres__Host: postgres
      DataSaver__Postgres__Port: "5432"
      DataSaver__Postgres__Database: ktm_revisor
      DataSaver__Postgres__SslMode: Disable
    secrets:
      - ktm_migrator_password
    volumes:
      - ../../db:/db:ro
      - ../data-saver/migrate:/migrate:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  kafka_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  ktm_migrator_password:
    file: ./secrets/ktm_migrator_password
  ktm_app_password:
    file: ./secrets/ktm_app_password
