[agents]
enabled = true
max_concurrent_threads_per_session = 4

[agents.teamlead]
description = "Технический лид backend-части (C#/.NET) проекта «Система мониторинга показателей производственной деятельности КТМ». Декомпозирует требования ТЗ, принимает и фиксирует архитектурные решения в ADR, выбирает стек и границы сервисов, проектирует схему данных и API, готовит ЧТЗ, проверяет риски и готовность этапов. Не занимается рутинной реализацией фич."
config_file = "agents/teamlead.toml"

[agents.developer]
description = "Senior Backend-разработчик (C#/.NET) проекта «Система мониторинга показателей производственной деятельности КТМ». Реализует задачи по ТЗ и ЧТЗ, адаптеры источников, нормализацию и хранение событий, движок правил, расчёт показателей, инциденты, REST API, фоновые обработчики, миграции БД, тесты и исправление дефектов. Для архитектурных решений и декомпозиции использует teamlead."
config_file = "agents/developer.toml"

[agents.reviewer]
description = "Senior C#/.NET Code Reviewer проекта «Система мониторинга показателей производственной деятельности КТМ». Проверяет код на соответствие требованиям ТЗ, ЧТЗ, архитектурным решениям, стандартам кодирования и безопасности. Не пишет код сам, а только ревьювит чужой. Использует скиллы codereview, dotnet-webapi, optimizing-ef-core-queries"
config_file = "agents/reviewer.toml"